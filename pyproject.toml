[project]
name = "comfyui-seglllite"
description = "Makes Impact/LanPaint SEGS detailers work with ControlNet-LLLite: every detected region is sampled with its own LLLite control hint (its own crop, a pose map from that crop, or a crop of a global control image). Also ships text-prompted SAM2+GroundingDINO segmentation with a transformers>=5 compatibility shim."
version = "1.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# 核心零强依赖：transformers / torch / impact-pack 等全部在节点内惰性 import，
# 缺失时只禁用相关节点，绝不让 ComfyUI 启动失败。
dependencies = []
readme = "README.md"

[project.urls]
Repository = "https://github.com/opaiopaio/ComfyUI-SegLLLite"
Issues = "https://github.com/opaiopaio/ComfyUI-SegLLLite/issues"

[tool.comfy]
PublisherId = "opaiopaio"
DisplayName = "SegLLLite"
Icon = ""
